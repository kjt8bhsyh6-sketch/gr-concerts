name = "grh-profiles"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# First-party API on the site's own domain (same origin as Pages) so the session cookie is first-party and
# survives Safari ITP; the Worker strips the /api prefix. workers.dev stays up for old cached pages.
routes = [{ pattern = "grhappenings.com/api/*", zone_name = "grhappenings.com" }]
[vars]
SITE_URL = "https://grhappenings.com/"
# CAN-SPAM postal address shown in every email footer (Worker alerts + scripts/weekly-email.js). Never a home address.
MAILING_ADDRESS = "P.O. Box 140186, Grand Rapids, MI 49504"

[[kv_namespaces]]
binding = "KV"
id = "3e4bc178e90940eaa813a8db724e1db9"

# Outbound ticket-click log (no cookies/IP). Query via Cloudflare D1 console or API.
[[d1_databases]]
binding = "CLICKS"
database_name = "grh-clicks"
database_id = "d2e6ab28-38b6-4bff-bfbd-d85963e60db8"

# Pending event submissions (private). Commented out on purpose: do not create or bind a
# production namespace from this staging branch. TURNSTILE_SECRET is a Worker secret, never a var here.
# [[kv_namespaces]]
# binding = "SUBMISSIONS"
# id = "REPLACE_PRODUCTION_KV_ID"

# Staging only. `routes` is inheritable, so an empty list is required — omitting it would
# attach this environment to the production route grhappenings.com/api/*.
# kv_namespaces are NOT inherited; staging must not reuse the production profile KV.
# Deploy with: wrangler deploy --env staging
# Never: wrangler deploy   (that publishes the top-level production Worker)
[env.staging]
name = "grh-profiles-staging"
workers_dev = true
routes = []

[[env.staging.kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_STAGING_KV_ID"
