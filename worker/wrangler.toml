name = "grh-profiles"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# First-party API on the site's own domain (same origin as Pages) so the session cookie is first-party and
# survives Safari ITP; the Worker strips the /api prefix. workers.dev stays up for old cached pages.
routes = [{ pattern = "grhappenings.com/api/*", zone_name = "grhappenings.com" }]
[vars]
SITE_URL = "https://grhappenings.com/"
# CAN-SPAM postal address shown in every email footer (Worker alerts + scripts/weekly-email.js). Never a home address.
MAILING_ADDRESS = "The Canasta Club, PO Box 140186, Grand Rapids, MI 49504"

[[kv_namespaces]]
binding = "KV"
id = "3e4bc178e90940eaa813a8db724e1db9"
